services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dispute
      POSTGRES_USER: dispute
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dispute}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispute -d dispute"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dispute
      SPRING_DATASOURCE_USERNAME: dispute
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-dispute}
      # The dev profile adds the demo seed data, which uses known passwords. Do not use it in production.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "8080:8080"

volumes:
  pgdata:
